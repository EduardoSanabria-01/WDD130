<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Contact Rafting Adventures for reservations, general inquiries, or feedback. We are here to serve you.">
    <meta name="author" content="Eduardo Sanabria">
    <title>Contact Us | Rafting Adventures Company</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header class="grid">
        <img src="images/rafting.jpg" alt="rafting adventures logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <!-- Título Principal de la Página -->
        <section class="contact-title">
            <h1>White Water Rafting Company</h1>
            <p class="company-details">
                123 Main River Street<br>
                Kolob, California<br>
                +1 999 999 9999<br>
                info@whitewater.com
            </p>
        </section>

        <!-- Contenedor de dos columnas para el Mapa y el Formulario -->
        <div class="contact-grid">
            <!-- Mapa de Google -->
            <div class="map-box">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3164.7171449336125!2d-112.9818818!3d37.4709121!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x80cac43464ba9637%3A0x6b40bd47ef71fb4c!2sKolob%20Canyons!5e0!3m2!1ses!2s!4v1710000000000!5m2!1ses!2s"
                  width="600" height="450" allowfullscreen="" loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>

            <!-- Formulario de Contacto Corregido -->
            <form action="#" method="post" class="contact-form">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="username" placeholder="Your full name"
                      required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="useremail" placeholder="Your email address"
                      required>
                </div>

                <fieldset class="radio-group">
                    <legend>Message Purpose</legend>
                    <!-- Agregados IDs únicos y vinculados correctamente -->
                    <label for="purpose-general">
                        <input type="radio" id="purpose-general" name="purpose" value="general"
                          checked>
                        General Inquiry
                    </label>
                    <label for="purpose-reservation">
                        <input type="radio" id="purpose-reservation" name="purpose"
                          value="reservation">
                        Reservation Question
                    </label>
                    <label for="purpose-suggestion">
                        <input type="radio" id="purpose-suggestion" name="purpose"
                          value="suggestion">
                        Website Suggestion
                    </label>
                </fieldset>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="usermessage" rows="5"
                      placeholder="Type your message here..." required></textarea>
                </div>

                <div class="checkbox-group">
                    <!-- Agregado ID único al checkbox -->
                    <label for="subscribe">
                        <input type="checkbox" id="subscribe" name="subscribe" value="yes"> Please
                        Subscribe me to the monthly newsletter
                    </label>
                </div>

                <button type="submit" class="submit-btn">Get in Touch!</button>
            </form>
        </div>

        <!-- Sección del Personal / Empleados -->
        <section class="team-section">
            <h2>We Are Here to Serve You</h2>
            <div class="team-gallery">
                <figure>
                    <img src="images/raftingadventure.jpg" alt="Employee Profile 1">
                    <figcaption>John Doe - Manager</figcaption>
                </figure>
                <figure>
                    <img src="images/expertguides.jpg" alt="Employee Profile 2">
                    <figcaption>Jane Smith - Lead Guide</figcaption>
                </figure>
                <figure>
                    <img src="images/best-clients.jpg" alt="Employee Profile 3">
                    <figcaption>Mike Johnson - Customer Relations</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <!-- Incluye Símbolo, Año, Nombre de la Empresa y tu Nombre para la revisión manual -->
        <p>&copy;2026 | Rafting Adventures Company | Victor Eduardo Sanabria Diaz | Ica, Perú</p>
        <nav class="socialmedia">
            <a href="https://facebook.com"><img src="images/facebook.png" alt="Facebook Icon"></a>
            <a href="https://x.com/?lang=es"><img src="images/twitter.png" alt="X Icon"></a>
            <a href="https://instagram.com"><img src="images/instagram.png"
                  alt="Instagram Icon"></a>
        </nav>
    </footer>
</body>

</html>
